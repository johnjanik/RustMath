[package]
name = "rustmath-ellipticcurves"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustmath-core = { path = "../rustmath-core" }
rustmath-integers = { path = "../rustmath-integers" }
rustmath-rationals = { path = "../rustmath-rationals" }
rustmath-complex = { path = "../rustmath-complex" }
rustmath-finitefields = { path = "../rustmath-finitefields" }
rustmath-reals = { path = "../rustmath-reals" }
rayon = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# Dev-only: cross-checks a_p (Eichler-Shimura), root numbers (Fricke) and
# exact L(1)-vanishing (Manin-Birch winding) against the modular-symbols
# machinery. Dev-deps do not propagate, so the lib dependency graph stays
# clean (and rustmath-modular does not depend on this crate, so no cycle).
rustmath-modular = { path = "../rustmath-modular" }

[features]
default = []
serde = ["dep:serde"]
