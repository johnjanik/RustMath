[package]
name = "rustmath-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustmath"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "num-bigint"] }
num-bigint = "0.4"
rustmath-core = { path = "../rustmath-core" }
rustmath-integers = { path = "../rustmath-integers" }
rustmath-rationals = { path = "../rustmath-rationals" }
rustmath-complex = { path = "../rustmath-complex" }
rustmath-reals = { path = "../rustmath-reals" }
rustmath-matrix = { path = "../rustmath-matrix" }
rustmath-polynomials = { path = "../rustmath-polynomials" }
rustmath-symbolic = { path = "../rustmath-symbolic" }
rustmath-finitefields = { path = "../rustmath-finitefields" }
rustmath-plot = { path = "../rustmath-plot" }
rustmath-plot-core = { path = "../rustmath-plot-core" }
rustmath-colors = { path = "../rustmath-colors" }
rayon = "1.8"
